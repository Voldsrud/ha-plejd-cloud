name: Bug report
description: Something in the integration isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        ⚠️ **Do not paste sensitive data.** Logs and diagnostics from this integration
        can contain your Plejd account email, the **site crypto key**, BLE device
        addresses, and session tokens. **Redact these before posting.** For a
        suspected *security* problem, use the [private advisory flow](../../security/advisories/new)
        instead of a public issue.
  - type: checkboxes
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest commit of `main` (or the latest release).
          required: true
        - label: I've redacted the crypto key, account email, BLE addresses, and tokens from anything I paste.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.5.1"
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: HACS version tag, or commit SHA if installed from source.
      placeholder: "v0.x.y or abc1234"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - HACS
        - Manual (copied custom_components/plejd_cloud)
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Bluetooth adapter / proxy
      description: Local BlueZ adapter, ESPHome Bluetooth proxy, etc.
      placeholder: "e.g. built-in adapter / ESPHome BT proxy"
    validations:
      required: false
  - type: textarea
    id: devices
    attributes:
      label: Plejd device models
      description: Which Plejd products are involved (DIM-01, CTR-01, REL-01, LED-10, WPH-01, ...).
      placeholder: "e.g. 2x DIM-02, 1x CTR-01"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Set `custom_components.plejd_cloud` to debug, reproduce, and paste the **redacted** log. This is rendered as code, no backticks needed.
      render: text
    validations:
      required: false
